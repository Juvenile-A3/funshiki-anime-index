<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>泛式资料库 · 整理台</title><link rel="icon" href="/mobile/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/mobile/style.css"><link rel="manifest" href="/mobile/manifest.webmanifest"><meta name="theme-color" content="#385d4d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="/mobile/mobile.css"></head>
<body class="mobile-loading"><section id="mobile-start"><h1>泛式资料库 · 随身整理台</h1><p>导入协作包，在这台设备上独立核对，再导出修改包合并。</p><p id="mobile-status" role="status">正在准备整理台…</p><div id="mobile-start-actions" hidden><label class="file-button">导入协作 ZIP<input id="mobile-import" type="file" accept=".zip,application/zip"></label><div id="mobile-saved"></div></div><p class="muted">首次打开需联网准备。数据保存在当前浏览器；请定期导出修改或恢复包。封面、原视频和 Bangumi 查询需要联网。</p></section><div id="mobile-bar" hidden><button id="mobile-packages">切换 / 导入协作包</button><button id="mobile-backup">导出恢复包</button><span id="mobile-save-state" role="status"></span></div>
<aside><div class="brand"><span class="brand-icon">泛</span><div>泛式资料库<small>资料整理与核对</small></div></div>
<nav aria-label="资料库导航"><button data-nav="recordings" class="active">01　录播目录</button><button data-nav="entries">02　时轴作品核对</button><button data-nav="works">03　作品资料</button><button data-nav="series">04　系列管理</button><button data-nav="aliases">05　黑话核对</button><button data-nav="audit_log">06　修改记录</button><button data-nav="collaboration">07　协作与合并</button></nav>
<div class="sidebar-bottom"><span class="dot"></span> 本地数据库 · 保存即入库<p>原始资料和修改记录均保留。<br>候选关联需要逐条核对。</p><button id="export">导出 JSON 与 CSV ↗</button><button id="recognize">重新识别待整理时轴</button></div></aside>
<main><header><div><div class="eyebrow">FUNSHIKI ARCHIVE / LIBRARY</div><h1 id="title">录播目录</h1><p id="subtitle"></p></div><button id="add-work" hidden>＋ 添加作品</button></header>
<section id="stats" aria-label="资料库统计"></section><section class="workspace"><form id="filters" class="filters"><input id="search" type="search" placeholder="搜索录播名称或 BV 号" aria-label="搜索资料"><select id="filter-a" aria-label="分类"></select><select id="filter-quarter" aria-label="季度"></select><select id="filter-extra" aria-label="核对状态"></select><button type="submit">查找</button><button type="button" id="clear">清空筛选</button></form>
<div id="context"></div><div class="list-top"><span id="count"></span><span>原文可追溯 · 支持人工修正</span></div><div id="review-toolbar" hidden><button class="primary" id="confirm-page">确认本页全部正确</button><span id="review-page-note"></span></div><div id="list" aria-live="polite"></div><footer class="pagination"><button id="prev">← 上一页</button><span id="page"></span><button id="next">下一页 →</button></footer></section></main>
<dialog id="editor"><div class="dialog-head"><div><div class="eyebrow">REVIEW / EDIT</div><h2 id="editor-title"></h2></div><button id="close-editor" aria-label="关闭编辑器">✕</button></div><div id="editor-body"></div></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="/mobile/mobile.js"></script>
</body></html>
