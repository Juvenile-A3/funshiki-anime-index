name: Test and deploy Pages
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-assets.txt
      - run: npm run test:sync
      - run: npm run test:seasons
      - name: Restore previous metadata snapshot for the same source inputs
        id: assets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            site/assets/covers
            site/assets/subjects.json
          key: site-assets-v2-${{ hashFiles('data/catalog.json', 'site/assets/subjects.json', 'config/subject-overrides.json', 'scripts/sync_site_assets.py', 'scripts/requirements-assets.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            site-assets-v2-${{ hashFiles('data/catalog.json', 'site/assets/subjects.json', 'config/subject-overrides.json', 'scripts/sync_site_assets.py', 'scripts/requirements-assets.txt') }}-
      - name: Check Bangumi changes and update local snapshots
        run: npm run sync:assets -- --refresh --allow-stale
      - run: npm run check
      - name: Cache the validated snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            site/assets/covers
            site/assets/subjects.json
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
